# 不推荐通过 nginx 代理 dolphindb 网页，主要是性能方面的考量
# 使用 nginx 进行转发时，它需要处理从客户端到服务器的请求和响应。这个额外的处理过程可能导致性能的轻微降低，尤其是在高负载情况下。
# 虽然 nginx 通常是一个高效的服务器，但在某些情况下，直接将流量发送到目标服务器可能更为高效。
# nginx 不适合 WebSocket 长连接，对于 WebSocket 的支持可能不如其他服务器，因为 nginx 在设计上更侧重于短连接的高性能
# 如果一定要用 nginx
# dolphindb web 支持部署到 / 或者 /dolphindb/ 这两个路径下面
# 如果要部署单节点 dolphindb 到 /dolphindb/ 路径下，应该打开 index.template.html 和 window.template.html，将里面的 {root} 字符串替换为 /dolphindb/ 之后，保存并替换 index.html 和 window.html
#
# 如果要部署多个节点，支持通过 /dolphindb/nodes/{节点名}/ 形式的路径，将集群中的多个 dolphindb 节点代理到同一个域名下，使用不同的路径访问各个节点
# - 路径中的节点名需要与 dolphindb 的节点别名 (getNodeAlias 的返回值) 一致，这样在集群管理页面中点击节点名称，会自动跳转到对应节点的 /dolphindb/nodes/{节点名}/ 路径
# - 每个节点的 web 部署同样需要将 index.template.html 和 window.template.html 中的 {root} 字符串替换为对应的 /dolphindb/nodes/{节点名}/ 之后保存并替换 index.html 和 window.html
# - web 会根据浏览器地址栏中的路径自动识别出 /dolphindb/nodes/{节点名}/ 前缀，用于加载静态资源和建立 websocket 连接，无需其他配置
# 多节点配置示例，见下面 server 中的 location /dolphindb/nodes/{节点名}/ 部分


http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    
    server {
        # 单节点代理配置
        location /dolphindb/ {
            proxy_pass http://192.168.1.111:8848/;
            
            proxy_http_version  1.1;
            
            proxy_set_header    Host            $host;
            proxy_set_header    X-Real-IP       $remote_addr;
            proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
            
            
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            
            proxy_connect_timeout 30000;
            proxy_read_timeout 7d;
            proxy_send_timeout 7d;
            
            client_max_body_size 2g;
        }
        
        # 多个节点代理配置：为每个节点配置一个 location，路径中的节点名与 dolphindb 的节点别名一致
        # 其余节点参考此 location，替换路径中的节点名和 proxy_pass 中的节点地址即可
        location /dolphindb/nodes/controller1/ {
            proxy_pass http://192.168.1.111:8848/;
            
            # 其余配置同上
        }
        
        location /dolphindb/nodes/datanode1/ {
            proxy_pass http://192.168.1.112:8848/;
            
            # 其余配置同上
        }
    }
}

# ref:
# https://www.jianshu.com/p/6205c8769e3c
# http://nginx.org/en/docs/http/websocket.html
